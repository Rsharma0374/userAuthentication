apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: rsharma0374/auth-service:latest
          ports:
            - containerPort: 10001
          volumeMounts:
            - name: infisical-secret-volume
              mountPath: /opt/configs/infisical.properties
              subPath: infisical.properties
              readOnly: true
      volumes:
        - name: infisical-secret-volume
          secret:
            secretName: infisical-secret
            items:
              - key: infisical.properties
                path: infisical.properties