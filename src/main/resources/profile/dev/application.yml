spring:
  application:
    name: auth-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: uam-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  datasource:
    url: jdbc:postgresql://localhost:5432/uam_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:https://keycloak.guardianservices.in}/realms/${KEYCLOAK_REALM:guardian-service}/protocol/openid-connect/certs

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka.guardianservices.in:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

# Server Configuration
server:
  port: 10001
  servlet:
    context-path: /auth-service
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# Keycloak Configuration
keycloak:
  auth-server-url: ${KEYCLOAK_URL:https://keycloak.guardianservices.in}

  # Your application realm
  realm: ${KEYCLOAK_REALM:guardian-service}

  # Client used for admin operations
  resource: ${KEYCLOAK_CLIENT_ID:api-gateway}

  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET:BbH9EsDrDNeUPHmnSIXE5Hz9E29mpgCF}

  admin:
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:api-gateway}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:BbH9EsDrDNeUPHmnSIXE5Hz9E29mpgCF}

  ssl-required: external
  use-resource-role-mappings: true

  # IMPORTANT
  bearer-only: false

  public-client: false
  principal-attribute: preferred_username
# Email Service Configuration
email:
  service:
    url: ${EMAIL_SERVICE_URL:http://email-connector-service:10002}

# Email Connector API
connector:
  email:
    send:
      api: ${EMAIL_CONNECTOR_API:http://localhost:10002/email-connector/send-mail}

# Password Manager Service
pass:
  manager:
    user:
      create:
        url: ${PASSWORD_MANAGER_URL:http://localhost:10003/password-manager/create-user}

# Log Collection
log:
  collectionName: UserAuthLog

# Security Configuration
security:
  ignored: /public/**,/actuator/**,/swagger-ui/**,/api-docs/**

# Management / Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

# Logging Configuration
logging:
  level:
    com.yourorg.uam: DEBUG
    org.springframework.security: INFO
    org.springframework.cloud: INFO
    org.keycloak: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/auth-service.log
    max-size: 10MB
    max-history: 30

# Swagger/OpenAPI (if enabled)
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html