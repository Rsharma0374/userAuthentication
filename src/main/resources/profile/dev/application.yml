spring:
  application:
    name: auth-service
eureka:
  client:
    service-url:
      defaultZone: http://eureka.guardianservices.in:8761/eureka/
server:
  port: 10001
  servlet:
    context-path: /auth-service


keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:uam-realm}
  resource: ${KEYCLOAK_CLIENT_ID:uam-client}
  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET:your-client-secret}
  admin:
    client-id: admin-cli
    username: ${KEYCLOAK_ADMIN_USER:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  ssl-required: external
  use-resource-role-mappings: true
  bearer-only: true

# Direct internal URL of Email Service (K8s DNS or Docker Compose service name)
email:
  service:
    url: http://email-connector-service:10002

log:
  collectionName: UserAuthLog

security:
  ignored: /**/public


# Email connector API
connector:
  email:
    send:
      api: http://localhost:10002/email-connector/send-mail


pass:
  manager:
    user:
      create:
        url: http://localhost:10003/password-manager/create-user

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
